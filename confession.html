<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#120019,#2b0434,#4d0b4e);
  overflow-x:hidden;
  color:white;
  min-height:100vh;
  position:relative;
}

/* Glow */
body::before,body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  filter:blur(140px);
  opacity:.35;
  z-index:-1;
}

body::before{
  width:340px;
  height:340px;
  background:#ff5fa8;
  top:-120px;
  left:-100px;
}

body::after{
  width:260px;
  height:260px;
  background:#ffc1df;
  bottom:-80px;
  right:-90px;
}

/* Sakura */
.petal{
  position:fixed;
  top:-40px;
  pointer-events:none;
  font-size:18px;
  opacity:.8;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(120vh) translateX(60px) rotate(360deg);
    opacity:0;
  }
}

/* Envelope Section */
.scene{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}

.scene h1{
  font-family:'Caveat',cursive;
  font-size:4rem;
  color:#ffd7ec;
}

.scene p{
  margin-top:10px;
  opacity:.8;
}

.envelope{
  width:320px;
  height:220px;
  position:relative;
  margin:40px 0 20px;
  cursor:pointer;
}

.base{
  position:absolute;
  inset:0;
  background:#ffb7d8;
  border-radius:0 0 20px 20px;
  box-shadow:0 20px 35px rgba(0,0,0,.25);
}

.flap{
  position:absolute;
  inset:0;
  background:#ff8cc4;
  clip-path:polygon(0 0,100% 0,50% 60%);
  transform-origin:top;
  transition:1s;
  z-index:5;
}

.letter{
  position:absolute;
  width:85%;
  height:180px;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  background:white;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:3rem;
  color:#ff4f9f;
  transition:1.1s;
  box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.envelope.open .flap{transform:rotateX(180deg);}
.envelope.open .letter{bottom:120px;}

.hint{
  animation:pulse 2s infinite;
}

@keyframes pulse{50%{opacity:1;}}

/* Letter Page */
.page{
  display:none;
  background:linear-gradient(180deg,#fff9fc,#fff0f7);
  min-height:100vh;
  padding:40px 20px 60px;
}

.paper{
  max-width:720px;
  margin:auto;
  background:white;
  color:#333;
  padding:35px;
  border-radius:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.date{
  font-size:.8rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#999;
}

.paper h1{
  font-family:'Caveat',cursive;
  color:#ff5b9f;
  font-size:3rem;
  margin:10px 0 25px;
}

#typed{
  white-space:pre-wrap;
  line-height:2;
  min-height:380px;
}

.signature{
  margin-top:30px;
  font-family:'Caveat',cursive;
  font-size:2rem;
  color:#ff5b9f;
  opacity:0;
  transition:1s;
}

.next{
  display:none;
  margin-top:35px;
  padding:16px 34px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,#ff5b9f,#ff83c9);
  color:white;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(255,91,159,.3);
}

.next:hover{transform:translateY(-2px) scale(1.03);}

@media(max-width:600px){
  .scene h1{font-size:3rem;}
  .envelope{width:260px;height:180px;}
  .paper{padding:25px;}
  .paper h1{font-size:2.4rem;}
  #typed{font-size:.9rem;}
}
</style>
</head>
<body>

<div id="petals"></div>

<!-- Envelope -->
<section class="scene" id="scene">
  <h1>A Letter For You 💌</h1>
  <p>Please read this until the end.</p>

  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="base"></div>
    <div class="letter">💌</div>
  </div>

  <p class="hint">Tap the envelope to open it.</p>
</section>

<!-- Letter -->
<section class="page" id="page">
  <div class="paper">

    <div class="date">September 2026</div>
    <h1>Dear Sayang 🌷</h1>

    <div id="typed"></div>

    <div class="signature" id="signature">
      — From your annoying boyfriend (hopefully again) ❤️
    </div>

    <button class="next" id="nextBtn" onclick="window.location.href='memories.html'">
       Continue 
    </button>

  </div>
</section>

<script>

/* Sakura */
setInterval(()=>{
  const p=document.createElement('div');
  p.className='petal';
  p.innerHTML='🌸';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=(6+Math.random()*5)+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),12000);
},450);

/* Open Envelope */
const envelope=document.getElementById('envelope');
const scene=document.getElementById('scene');
const page=document.getElementById('page');

envelope.onclick=()=>{
  envelope.classList.add('open');

  setTimeout(()=>{
    scene.style.display='none';
    page.style.display='block';
    window.scrollTo({top:0,behavior:'instant'});
    typeLetter();
  },1700);
}

/* Letter Text */
const letter=`Before I ask you anything...
There is something I need to say first.
I'm sorry.
I know today happened because of me.
And what hurts me the most isn't just that we argued...
It's realizing that I repeated the same mistake again.
You gave me chances before.
You trusted me to do better.
But I still disappointed you.
I'm not making this website because I'm scared of losing a girlfriend.
I'm making this because I know I hurt my favorite person.
I know beautiful words won't erase what happened today.
I know trust isn't fixed with one apology.
But I hope this can be the beginning of me showing that I really understand my mistake.
Thank you for listening.
Thank you for reading this letter until the end.
And thank you...
for still giving me a chance to stay here.`;

let i=0;
const typed=document.getElementById('typed');

function typeLetter(){
  if(i<letter.length){
    typed.innerHTML+=letter.charAt(i);
    i++;
    setTimeout(typeLetter,28);
  }else{
    document.getElementById('signature').style.opacity=1;

    const btn=document.getElementById('nextBtn');
    btn.style.display='inline-block';

    setTimeout(()=>{
      btn.scrollIntoView({behavior:'smooth',block:'center'});
    },500);
  }
}

</script>

</body>
</html>
